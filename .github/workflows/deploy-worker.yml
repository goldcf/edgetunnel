name: Deploy edgetunnel worker

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: edgetunnel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate wrangler config
        run: |
          cat > deploy/wrangler.toml <<EOF
          name = "edgetunnel"
          main = "_worker.js"
          compatibility_date = "2025-11-04"
          keep_vars = true

          [[kv_namespaces]]
          binding = "KV"
          id = "${{ secrets.KV_NAMESPACE_ID }}"

          [vars]
          ADMIN = "${{ secrets.EDG_ADMIN }}"
          EOF
          sed -n '1,20p' deploy/wrangler.toml | sed 's/ADMIN = .*/ADMIN = (***)/'

      - name: Deploy
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' https://edg.410425.xyz/login || true)
            echo "attempt $i: $code"
            if [ "$code" = "200" ] && grep -q "PingFang SC" /tmp/p.html; then
              echo "login page served from KV patch: OK"; exit 0
            fi
            sleep 10
          done
          echo "smoke test failed"; exit 1
