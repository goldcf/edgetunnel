name: Deploy edgetunnel to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: edgetunnel-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Pages output (advanced mode _worker.js)
        run: |
          mkdir -p out
          cp deploy/_worker.js out/_worker.js
          ls -lh out

      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name=edgetunnel-pages --branch=main --commit-dirty=true

      - name: Smoke test
        run: |
          ok=0
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' https://edg.410425.xyz/login || true)
            echo "attempt $i: $code"
            if [ "$code" = "200" ] && grep -q "PingFang SC" /tmp/p.html; then
              echo "smoke test OK: login page served by Pages"; ok=1; break
            fi
            sleep 15
          done
          if [ "$ok" = "0" ]; then
            echo "::warning::smoke test 未通过（可能只是证书/传播延迟），部署本身已成功"
          fi
