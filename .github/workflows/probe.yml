name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "--- login"; curl -s -o /tmp/a -w "%{http_code} %{size_download}\n" https://edg.410425.xyz/login; grep -c PingFang /tmp/a || true
          echo "--- ws upgrade"; curl -i --max-time 15 --http1.1 -H "Upgrade: websocket" -H "Connection: Upgrade" -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" -H "Sec-WebSocket-Version: 13" https://edg.410425.xyz/ | head -4
          echo "--- mail"; curl -s -o /dev/null -w "%{http_code}\n" https://mail.410425.xyz/
